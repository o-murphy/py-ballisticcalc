[build-system]
requires = [
    "setuptools>=84.0",
    "setuptools-scm",
    "cython>=3.2.9",
]
build-backend = "setuptools.build_meta"

[project]
name = "py_ballisticcalc.cabi"
authors = [
    { name="o-murphy", email="thehelixpg@gmail.com" },
    { name="dbookstaber", email="bookstaber@gmail.com"}
]
description = "bclibc engines of py_ballisticcalc as Cython over the C ABI of bclibc (bclibc_ffi.h): one abi3 extension with the core compiled in, no shared library"
readme = "README.md"
requires-python = ">=3.11"
keywords = ["py_ballisticcalc", "ballistics", "Cython", "C ABI", "ballistic calculator", "python", "python3"]
classifiers = [
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU Lesser General Public License v3 (LGPLv3)",
    "Natural Language :: English",
    "Operating System :: MacOS",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Operating System :: POSIX",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Unix",
    "Programming Language :: Cython",
    "Programming Language :: C++",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: Free Threading :: 3 - Stable",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
license-files = ["LICENSE"]
dependencies = []

# NOTE:
#   version: will be calculated with setuptools-scm, the same as the main package and the extensions
dynamic = ["version"]

# The same engines as py_ballisticcalc.exts and py_ballisticcalc.ctypes: the ids are cabi+<method>, so the packages can be installed together
[project.entry-points."py_ballisticcalc.engines.cabi"]
euler = "py_ballisticcalc_cabi:NativeEulerIntegrationEngine"
rk4 = "py_ballisticcalc_cabi:NativeRK4IntegrationEngine"
verlet = "py_ballisticcalc_cabi:NativeVelocityVerletIntegrationEngine"
rkck = "py_ballisticcalc_cabi:NativeCashKarpIntegrationEngine"
dopri = "py_ballisticcalc_cabi:NativeDormandPrinceIntegrationEngine"
tsitouras = "py_ballisticcalc_cabi:NativeTsitourasIntegrationEngine"

[project.urls]
"Homepage" = "https://github.com/o-murphy/py-ballisticcalc"
"Documentation" = "https://o-murphy.github.io/py-ballisticcalc"
"Bug Reports" = "https://github.com/o-murphy/py-ballisticcalc/issues"
"Source" = "https://github.com/o-murphy/py-ballisticcalc"

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
py_ballisticcalc_cabi = ["py.typed", "*.pxd", "*.pyx"]

[tool.setuptools.packages.find]
where = ["."]
include = ["py_ballisticcalc_cabi*"]
exclude = ["py_ballisticcalc_cabi.external*"]

[tool.setuptools_scm]
root = ".."  # required for valid .git repo root detect for subpackage in monorepo
fallback_version = "0.0.0.dev0"

[tool.cibuildwheel]
# Use uv and build
build-frontend = "build[uv]"
# cp311-abi3 covers standard CPython 3.11+ (incl. 3.15); free-threaded builds (cp314t-*, cp315t-*) are
# built separately because Py_LIMITED_API and Py_GIL_DISABLED are mutually incompatible.
# abi3t (PEP 803) is not used: Cython 3.3 has no stable support for it yet (cython/cython#7399).
# cp315t-* is a CPython prerelease until 3.15 final, hence the explicit enable.
build = "cp311-* cp314t-* cp315t-*"
enable = ["cpython-prerelease"]
# Tests: after each wheel is built, cibuildwheel installs it in a clean environment and runs every engine of the core
# test suite there, one after another (.github/scripts/cibw_run_engines.py). The workflow cibuildwheel-reusable.yml
# stages cibw_stage/ (the core tests, the core wheel) and the runner module cibw_run_engines.py in this folder; they
# are not committed.
# tests/ is the tests of this package: the runner runs it in the session of every engine, after the core suite
test-sources = ["cibw_stage", "cibw_run_engines.py", "tests"]
# The test environment gets the dependency group `test` (below): cibuildwheel installs the wheel under test and the
# groups of this pyproject, it does not run `uv sync`, and the core package is not there to bring its own extras.
test-groups = ["test"]
test-command = "python cibw_run_engines.py cabi"

# No scipy wheels. PyPI has them only for macOS (x86_64, arm64), manylinux and musllinux (x86_64, aarch64) and Windows
# (AMD64, ARM64), for CPython 3.11 up to 3.15 including the free-threaded builds (checked against scipy 1.17.1 and
# 1.18.1); none for 32-bit Windows, i686, armv7l, ppc64le, s390x, riscv64, and Pyodide takes its packages from
# elsewhere. These get the group without numpy and scipy, and the
# runner then leaves the scipy engines out too.
[[tool.cibuildwheel.overrides]]
select = ["*-win32", "*_i686", "*_armv7l", "*_ppc64le", "*_s390x", "*_riscv64", "*-pyodide_*"]
test-groups = ["test-noscipy"]

[tool.cibuildwheel.android]
build = "cp313-android_* cp314-android_* cp315-android_*"
# The x86-64 wheel is tested in the emulator (cibuildwheel sets up KVM); the arm64 one is only built, there is no arm64
# emulator on the x86-64 runners
test-skip = "*-android_arm64_v8a"
# Android accepts only a test command that starts with "python" and contains -m or -c: start the runner through runpy
test-command = "python -c \"import runpy,sys; sys.argv=['cibw_run_engines.py','cabi']; runpy.run_path('cibw_run_engines.py', run_name='__main__')\""
# no scipy wheels for Android
test-groups = ["test-noscipy"]

[tool.cibuildwheel.pyodide]
build = "cp313-pyodide_* cp314-pyodide_* cp315-pyodide_*"

# iOS: the simulator wheels are built and tested; the device wheel (arm64_iphoneos) is built without tests, since
# cibuildwheel runs tests only on simulator SDKs and nothing in CI can run a device build.
[tool.cibuildwheel.ios]
build = "cp313-ios_* cp314-ios_* cp315-ios_*"
# cibuildwheel refuses build[uv] for iOS ("uv doesn't support iOS"): the plain build frontend here
build-frontend = "build"
# iOS runs only `python -m ...` test commands: the runner is started as a module
test-command = "python -m cibw_run_engines cabi"
# no scipy wheels for iOS
test-groups = ["test-noscipy"]

[tool.cibuildwheel.linux]
# Docker's default seccomp profile on the Ubuntu 26.04 runners refuses 32-bit socket calls: uv panics
# (tokio UnixStream, ENOSYS) and pip cannot reach the index in the i686 container. Run the Linux containers
# with seccomp unconfined (the same fix natify-sh/waboros uses).
container-engine = { name = "docker", create-args = ["--security-opt", "seccomp=unconfined"] }

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-m 'not stress'"
markers = ["stress: long-running or resource-intensive tests, opt-in only"]

[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "setup.py" },
    { file = "_bclibc.py" },
    { file = "py_ballisticcalc_cabi/**/*.{py,pyx,pxd}" },
    { file = "py_ballisticcalc_cabi/external/**/*.{cpp,hpp,h}" },
    # build flags read by setup.py
    { env = "CYTHON_COVERAGE" },
    { env = "CYTHON_SAFETY" },
    { env = "CYTHON_FORCE_REGEN" },
    { env = "DISABLE_SHARED_STRIP" },
    { git = { commit = true } },
]

[dependency-groups]
# autopxd2 makes py_ballisticcalc_cabi/_bcffi.pxd from bclibc_ffi.h (regenerate_bindings.py); the result is committed.
dev = [
    "autopxd2==4.2.0",
    "cibuildwheel>=4.1.1",
    "cython>=3.2.9",
]
# What cibuildwheel installs next to a wheel to test it (see [tool.cibuildwheel] test-groups), and what
# `uv sync --group test` gives for running the same tests by hand. typing_extensions and Deprecated are the core's own
# dependencies (here with the newest Deprecated that each Python takes), numpy and scipy its `scipy` extra (the same
# bounds): the core itself is not installed in the test
# environment, `.github/scripts/cibw_run_engines.py` puts the core wheel on the path.
test-noscipy = [
    "pytest",
    "pytest-xdist",
    "typing_extensions>=4.15.0",
    "Deprecated>=3.0.1; python_version >= '3.12'",  # Deprecated 3 needs Python 3.12+
    "Deprecated>=1.3.1; python_version < '3.12'",
]
test = [
    {include-group = "test-noscipy"},
    "numpy>=2.5.0; python_version >= '3.12'",
    "numpy>=2.4.6; python_version < '3.12'",
    "scipy>=1.18.0; python_version >= '3.12'",
    "scipy>=1.17.1; python_version < '3.12'",
]
