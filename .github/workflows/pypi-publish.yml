name: Build and Upload Python Package to PyPI

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      testpypi:
        description: "Publish to test pypi"
        required: false
        type: boolean
        default: false
      version:
        description: "Override version (e.g. 2.3.0b1) — required for TestPyPI to get a clean version instead of a dev suffix"
        required: false
        type: string
        default: ""

run-name: >
  Build & Publish → ${{ github.event_name == 'push' && 'PyPI' ||
      github.event_name == 'workflow_dispatch' && inputs.testpypi && 'TestPyPI' ||
      'Build Only' }}

permissions:
  contents: write

jobs:
  create-release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Generate release notes
        id: notes
        uses: ./.github/actions/gen_release_notes
        with:
          version: ${{ github.ref_name }}

      - name: Create GitHub Release (draft)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "py-ballisticcalc ${{ github.ref_name }}" \
            --notes-file "${{ steps.notes.outputs.notes_file }}" \
            --draft

  build-sdist:
    name: Build SDist and pure Python wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          github-token: ${{ github.token }}

      - name: Build pure python package
        env:
          SETUPTOOLS_SCM_PRETEND_VERSION: ${{ inputs.version }}
          # setuptools_scm/vcs_versioning first tries SETUPTOOLS_SCM_OVERRIDES_FOR_<DIST>
          # (dist name canonicalized, e.g. PY_BALLISTICCALC / PY_BALLISTICCALC_EXTS), then
          # falls back to this un-scoped SETUPTOOLS_SCM_OVERRIDES for any dist without its
          # own var. Both py_ballisticcalc and py_ballisticcalc.exts need the same override,
          # so one shared var covers both instead of a _FOR_<DIST> var per package.
          # Only strip the local version (+g<hash>) when this run will actually publish —
          # PyPI/TestPyPI reject local version segments; build-only runs keep it for traceability.
          SETUPTOOLS_SCM_OVERRIDES: ${{ (github.event_name == 'push' || inputs.testpypi) && '{local_scheme = "no-local-version"}' || '' }}
        run: uv build --out-dir dist
        shell: bash

      - name: Build exts sdist
        env:
          SETUPTOOLS_SCM_PRETEND_VERSION: ${{ inputs.version }}
          # see SETUPTOOLS_SCM_OVERRIDES comment in "Build pure python package" above
          SETUPTOOLS_SCM_OVERRIDES: ${{ (github.event_name == 'push' || inputs.testpypi) && '{local_scheme = "no-local-version"}' || '' }}
        run: uv build py_ballisticcalc.exts --sdist --out-dir dist
        shell: bash

      - name: list ./dist
        run: ls ./dist
        shell: bash

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist-sdist
          path: ./dist
          retention-days: 14

  build:
    name: Build wheels on ${{ matrix.os }} / ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64 / x86
            artifact_key: linux-x64-x86
            os: ubuntu-latest
            cibw_archs: "i686,x86_64" # x64 native, i686 over QEMU
            cibw_platform: linux
            needs_qemu: true

          - name: Linux ARM64 / ARMv7
            artifact_key: linux-arm64-armv7
            os: ubuntu-24.04-arm
            cibw_archs: "aarch64,armv7l"
            cibw_platform: linux
            needs_qemu: false

          - name: Windows x64 / x86
            artifact_key: windows-x64-x86
            os: windows-latest
            cibw_archs: "x86,AMD64"
            cibw_platform: windows
            needs_qemu: false

          - name: Windows ARM64
            artifact_key: windows-arm64
            os: windows-11-arm
            cibw_archs: "ARM64"
            cibw_platform: windows
            needs_qemu: false

          - name: macOS Apple Silicon
            artifact_key: macos-arm64
            os: macos-26
            cibw_archs: "arm64,universal2"
            cibw_platform: macos
            needs_qemu: false

          - name: macOS Intel
            artifact_key: macos-x86_64
            os: macos-26-intel
            cibw_archs: "x86_64"
            cibw_platform: macos
            needs_qemu: false

          - name: Android ARM64 / x64
            artifact_key: android-arm64_v8a-x86_64
            os: ubuntu-latest
            cibw_archs: "arm64_v8a,x86_64"
            cibw_platform: android
            needs_qemu: false

          - name: Pyodide WebAssembly
            artifact_key: pyodide-wasm32
            os: ubuntu-latest
            cibw_archs: "wasm32"
            cibw_platform: pyodide
            needs_qemu: false

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # required for setuptools-scm
          submodules: recursive

      - name: Set up QEMU for Emulated Architectures
        if: ${{ matrix.needs_qemu }}
        uses: docker/setup-qemu-action@v4
        with:
          platforms: all

      - name: Cache cibuildwheel toolchain downloads
        # No benefit on Linux: manylinux/musllinux builds pull Docker images via
        # `docker pull`, which CIBW_CACHE_PATH does not cover. On every other
        # platform it caches cibuildwheel's downloaded interpreters/toolchains
        # (CPython/PyPy/GraalPy installers, nuget packages, Android NDK, the
        # pyodide emscripten/xbuildenv toolchain).
        if: ${{ matrix.cibw_platform != 'linux' }}
        uses: actions/cache@v6
        with:
          path: ~/.cache/cibuildwheel
          key: cibw-${{ matrix.artifact_key }}-${{ hashFiles('py_ballisticcalc.exts/pyproject.toml') }}
          restore-keys: |
            cibw-${{ matrix.artifact_key }}-

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          github-token: ${{ github.token }}

      - name: Build binary python package
        env:
          SETUPTOOLS_SCM_PRETEND_VERSION: ${{ inputs.version }}
          # see SETUPTOOLS_SCM_OVERRIDES comment in build-sdist / "Build pure python package".
          # Must also be listed in CIBW_ENVIRONMENT_PASS below, otherwise it never reaches
          # container-based builds (e.g. manylinux via Docker) — only Windows/macOS/Android
          # inherit the full host environment automatically.
          SETUPTOOLS_SCM_OVERRIDES: ${{ (github.event_name == 'push' || inputs.testpypi) && '{local_scheme = "no-local-version"}' || '' }}
          CIBW_ENVIRONMENT_PASS: SETUPTOOLS_SCM_PRETEND_VERSION SETUPTOOLS_SCM_OVERRIDES
          # Keep in sync with the cache step's `path` above — this makes the cache
          # location explicit instead of relying on cibuildwheel's platform-specific
          # default (which differs between Linux/macOS and Windows).
          CIBW_CACHE_PATH: ~/.cache/cibuildwheel
        run: |
          uvx cibuildwheel py_ballisticcalc.exts \
            --output-dir wheelhouse \
            --platform ${{ matrix.cibw_platform || 'auto' }} \
            --archs ${{ matrix.cibw_archs }}
        shell: bash

      - name: list ./wheelhouse
        run: ls ./wheelhouse
        shell: bash

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist-wheels-${{ matrix.artifact_key }}
          path: ./wheelhouse
          retention-days: 14

  publish:
    needs: [build-sdist, build]
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'push' && 'pypi' || inputs.testpypi && 'testpypi' || 'build' }}
    permissions:
      id-token: write

    steps:
      - name: Download all artifacts dynamically
        uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          path: ./all-dist

      - name: Combine artifacts
        run: |
          mkdir -p dist
          find ./all-dist -type f -exec cp {} dist/ \;
        shell: bash

      - name: list ./dist
        run: ls ./dist
        shell: bash

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: ./dist
          retention-days: 14

      - name: Publish package distributions to PyPI
        if: ${{ github.event_name == 'push' }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

      - name: Publish package distributions to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.testpypi == true }}
        with:
          skip-existing: true
          repository-url: https://test.pypi.org/legacy/
