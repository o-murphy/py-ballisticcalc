name: Build and Upload Python Package to PyPI

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      testpypi:
        description: "Publish to test pypi"
        required: false
        type: boolean
        default: false
      version:
        description: "Override version (e.g. 2.3.0b1) — required for TestPyPI to get a clean version instead of a dev suffix"
        required: false
        type: string
        default: ""

run-name: >
  Build & Publish → ${{ github.event_name == 'push' && 'PyPI' ||
      github.event_name == 'workflow_dispatch' && inputs.testpypi && 'TestPyPI' ||
      'Build Only' }}

permissions:
  contents: write

jobs:
  build-sdist:
    name: Build SDist and pure Python wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          github-token: ${{ github.token }}

      - name: Build pure python package
        env:
          SETUPTOOLS_SCM_PRETEND_VERSION: ${{ inputs.version }}
          # setuptools_scm/vcs_versioning first tries SETUPTOOLS_SCM_OVERRIDES_FOR_<DIST>
          # (dist name canonicalized, e.g. PY_BALLISTICCALC / PY_BALLISTICCALC_EXTS), then
          # falls back to this un-scoped SETUPTOOLS_SCM_OVERRIDES for any dist without its
          # own var. Both py_ballisticcalc and py_ballisticcalc.exts need the same override,
          # so one shared var covers both instead of a _FOR_<DIST> var per package.
          # Only strip the local version (+g<hash>) when this run will actually publish —
          # PyPI/TestPyPI reject local version segments; build-only runs keep it for traceability.
          SETUPTOOLS_SCM_OVERRIDES: ${{ (github.event_name == 'push' || inputs.testpypi) && '{local_scheme = "no-local-version"}' || '' }}
        run: uv build --out-dir dist
        shell: bash

      - name: Build exts sdist
        env:
          SETUPTOOLS_SCM_PRETEND_VERSION: ${{ inputs.version }}
          # see SETUPTOOLS_SCM_OVERRIDES comment in "Build pure python package" above
          SETUPTOOLS_SCM_OVERRIDES: ${{ (github.event_name == 'push' || inputs.testpypi) && '{local_scheme = "no-local-version"}' || '' }}
        run: uv build py_ballisticcalc.exts --sdist --out-dir dist
        shell: bash

      - name: list ./dist
        run: ls ./dist
        shell: bash

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist-sdist
          path: ./dist
          retention-days: 14

  # One job per matrix entry: cibuildwheel-reusable.yml builds the exts wheels and uploads them as the artifact below. The
  # wheels are not tested here (test_skip): they are on every pull request, by cibuildwheel-tests.yml. The engines that do not
  # depend on a wheel run once per Python version in the `pure` job below.
  build:
    name: Build wheels on ${{ matrix.os }} / ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64 / x86
            artifact_key: linux-x64-x86
            os: ubuntu-latest
            cibw_archs: "i686,x86_64" # both native on the x86-64 runner
            cibw_platform: linux
            needs_qemu: false

          - name: Linux ARM64 / ARMv7
            artifact_key: linux-arm64-armv7
            os: ubuntu-24.04-arm
            cibw_archs: "aarch64,armv7l"
            cibw_platform: linux
            needs_qemu: false

          - name: Windows x64 / x86
            artifact_key: windows-x64-x86
            os: windows-latest
            cibw_archs: "x86,AMD64"
            cibw_platform: windows
            needs_qemu: false

          - name: Windows ARM64
            artifact_key: windows-arm64
            os: windows-11-arm
            cibw_archs: "ARM64"
            cibw_platform: windows
            needs_qemu: false

          - name: macOS Apple Silicon
            artifact_key: macos-arm64
            os: macos-26
            cibw_archs: "arm64,universal2"
            cibw_platform: macos
            needs_qemu: false

          - name: macOS Intel
            artifact_key: macos-x86_64
            os: macos-26-intel
            cibw_archs: "x86_64"
            cibw_platform: macos
            needs_qemu: false

          # the simulator wheels are tested too (cibuildwheel runs the tests only on simulator SDKs); each on a runner of
          # its own architecture: the Intel simulator is not translated on an Apple Silicon runner
          - name: iOS simulator arm64
            artifact_key: ios-arm64-simulator
            os: macos-26
            cibw_archs: "arm64_iphonesimulator"
            cibw_platform: ios
            needs_qemu: false

          - name: iOS simulator x86-64
            artifact_key: ios-x86_64-simulator
            os: macos-26-intel
            cibw_archs: "x86_64_iphonesimulator"
            cibw_platform: ios
            needs_qemu: false

          # the device wheel (nothing can run it in CI; the simulator ones above are the tested iOS builds)
          - name: iOS device arm64
            artifact_key: ios-arm64-device
            os: macos-26
            cibw_archs: "arm64_iphoneos"
            cibw_platform: ios
            needs_qemu: false

          - name: Android ARM64 / x64
            artifact_key: android-arm64_v8a-x86_64
            os: ubuntu-latest
            cibw_archs: "arm64_v8a,x86_64"
            cibw_platform: android
            needs_qemu: false

          - name: Pyodide WebAssembly
            artifact_key: pyodide-wasm32
            os: ubuntu-latest
            cibw_archs: "wasm32"
            cibw_platform: pyodide
            needs_qemu: false

    uses: ./.github/workflows/cibuildwheel-reusable.yml
    with:
      os: ${{ matrix.os }}
      platform: ${{ matrix.cibw_platform }}
      archs: ${{ matrix.cibw_archs }}
      qemu: ${{ matrix.needs_qemu }}
      # built, not tested: the tests run on every pull request (cibuildwheel-tests.yml), a release only builds
      test_skip: "*"
      artifact_name: dist-wheels-${{ matrix.artifact_key }}
      retention_days: 14
      version: ${{ inputs.version }}
      # PyPI and TestPyPI reject local version segments (+g<hash>); build-only runs keep it for traceability
      no_local_version: ${{ github.event_name == 'push' || inputs.testpypi }}

  # The pure-Python and SciPy engines, once for each Python version that is built (the wheels themselves are tested on the
  # pull request, see test_skip above): a failure here stops the release as well.
  pure:
    name: Python and SciPy engines / Python ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14t", "3.15t"]
    uses: ./.github/workflows/pure-engines-reusable.yml
    with:
      python: ${{ matrix.python }}

  publish:
    needs: [build-sdist, build, pure]
    runs-on: ubuntu-latest
    # requires manual approval in repo Settings → Environments
    environment: ${{ github.event_name == 'push' && 'pypi' || inputs.testpypi && 'testpypi' || 'build' }}
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v7
        if: ${{ github.event_name == 'push' }}
        with:
          fetch-depth: 0

      - name: Generate release notes
        id: notes
        if: ${{ github.event_name == 'push' }}
        uses: ./.github/actions/gen_release_notes
        with:
          version: ${{ github.ref_name }}

      - name: Create GitHub Release
        if: ${{ github.event_name == 'push' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "py-ballisticcalc ${{ github.ref_name }}" \
            --notes-file "${{ steps.notes.outputs.notes_file }}"

      - name: Download all artifacts dynamically
        uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          path: ./all-dist

      - name: Combine artifacts
        run: |
          mkdir -p dist
          find ./all-dist -type f -exec cp {} dist/ \;
        shell: bash

      - name: list ./dist
        run: ls ./dist
        shell: bash

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: ./dist
          retention-days: 14

      - name: Publish package distributions to PyPI
        if: ${{ github.event_name == 'push' }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

      - name: Publish package distributions to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.testpypi == true }}
        with:
          skip-existing: true
          repository-url: https://test.pypi.org/legacy/
