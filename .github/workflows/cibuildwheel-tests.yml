name: Tests (cibuildwheel)
run-name: >-
  ${{ github.event_name == 'push' && format('Minimal Matrix — Push {0}', github.ref_name)
  || github.event_name == 'pull_request' && format('Full Matrix — PR {0}', github.event.pull_request.number)
  || format('Full Matrix — by hand {0}', github.ref_name) }}

# Builds the exts wheels with cibuildwheel and tests each of them on its own platform: every engine, one after another
# (cibuildwheel-reusable.yml, .github/scripts/cibw_run_engines.py): the Cython ones, which depend on the wheel; the
# pure-Python and SciPy engines run once per Python version in a job of their own. A pull request runs every platform; a
# push to a branch runs one Linux job; a run by hand (workflow_dispatch) runs every platform, as a pull request does. The
# release (pypi-publish.yml) builds the same wheels without tests: they run here.
on:
  pull_request:
    branches:
      - "**"
    paths:
      - "pyproject.toml"
      - "py_ballisticcalc/**"
      - "tests/**"
      - "py_ballisticcalc.exts/**"
      - ".gitmodules"
      - ".github/workflows/cibuildwheel-tests.yml"
      - ".github/workflows/cibuildwheel-reusable.yml"
      - ".github/workflows/pure-engines-reusable.yml"
      - ".github/scripts/cibw_run_engines.py"
      - ".github/matrices.yml"
      - ".github/actions/wheel-matrix/**"
      - ".github/scripts/wheel_matrix.py"
  push:
    branches:
      - "**" # "*" would skip branch names containing a slash (ci/x, feature/x)
    paths:
      - "pyproject.toml"
      - "py_ballisticcalc/**"
      - "tests/**"
      - "py_ballisticcalc.exts/**"
      - ".gitmodules"
      - ".github/workflows/cibuildwheel-tests.yml"
      - ".github/workflows/cibuildwheel-reusable.yml"
      - ".github/workflows/pure-engines-reusable.yml"
      - ".github/scripts/cibw_run_engines.py"
      - ".github/matrices.yml"
      - ".github/actions/wheel-matrix/**"
      - ".github/scripts/wheel_matrix.py"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The matrix is in .github/matrices.yml (the list of platforms is long and some are in more than one workflow)
  wheel_matrix:
    name: Wheel matrix
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.read.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github
      - id: read
        uses: ./.github/actions/wheel-matrix
        with:
          matrix: exts-tests

  # Full matrix: pull requests (and a manual run)
  full:
    name: ${{ matrix.name }}
    needs: wheel_matrix
    if: github.event_name != 'push'
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix: ${{ fromJSON(needs.wheel_matrix.outputs.matrix) }}

    uses: ./.github/workflows/cibuildwheel-reusable.yml
    with:
      os: ${{ matrix.os }}
      platform: ${{ matrix.cibw_platform }}
      archs: ${{ matrix.cibw_archs }}
      qemu: ${{ matrix.needs_qemu }}
      test_skip: ${{ matrix.test_skip || '' }}
      artifact_name: tests-wheels-${{ matrix.artifact_key }}
      retention_days: 1

  # The pure-Python and SciPy engines do not depend on the wheel under test, and each of their runs takes minutes (the Cython
  # ones, seconds): so they run once per Python version, on the core wheel, not again for every wheel above.
  core-wheel:
    name: Core wheel (pure Python)
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # setuptools-scm needs history
          submodules: recursive

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          github-token: ${{ github.token }}

      - run: uv build --wheel --out-dir dist .
        shell: bash

      - uses: actions/upload-artifact@v7
        with:
          name: tests-core-wheel
          path: dist/
          retention-days: 1
          if-no-files-found: error

  pure:
    name: Python and SciPy engines, Python ${{ matrix.python }}, ${{ matrix.os }}
    needs: core-wheel
    if: github.event_name != 'push'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.11", "3.14t", "3.15t"]
        include:
          # Windows and macOS once, on the oldest Python, with the engine that has the most Python in it and SciPy's (compiled
          # code, the likeliest to differ in the last digits between platforms)
          - { os: windows-latest, python: "3.11", groups: "python+rk4 scipy" }
          - { os: macos-26, python: "3.11", groups: "python+rk4 scipy" }
    uses: ./.github/workflows/pure-engines-reusable.yml
    with:
      os: ${{ matrix.os }}
      python: ${{ matrix.python }}
      groups: ${{ matrix.groups || 'python scipy' }}
      core_wheel_artifact: tests-core-wheel

  # Minimal matrix: pushes to a branch
  minimal:
    name: Linux x86-64
    if: github.event_name == 'push'
    uses: ./.github/workflows/cibuildwheel-reusable.yml
    with:
      os: ubuntu-latest
      platform: linux
      archs: x86_64
      build: "cp311-*"
      skip: "*-musllinux_*"
      artifact_name: tests-wheels-linux-x86_64
      retention_days: 1
