name: Tests (cibuildwheel)
# The title follows the job that runs: only a push runs the minimal matrix; a pull request and a manual run (workflow_dispatch)
# run the full one.
run-name: >
  ${{ github.event_name == 'push' && 'Minimal Matrix — Push'
  || github.event_name == 'pull_request' && 'Full Matrix — PR'
  || 'Full Matrix — by hand' }}
  ${{ github.event.pull_request.number || github.ref_name }}

# Builds the exts wheels with cibuildwheel and tests each of them on its own platform: every engine, one after another
# (cibuildwheel-reusable.yml, .github/scripts/cibw_run_engines.py): the Cython ones, which depend on the wheel; the
# pure-Python and SciPy engines run once per Python version in a job of their own. A pull request runs every platform; a
# push to a branch runs one Linux job. The release (pypi-publish.yml) builds the same wheels without tests: they run here.
on:
  pull_request:
    branches:
      - "**"
    paths:
      - "pyproject.toml"
      - "py_ballisticcalc/**"
      - "tests/**"
      - "py_ballisticcalc.exts/**"
      - ".gitmodules"
      - ".github/workflows/cibuildwheel-tests.yml"
      - ".github/workflows/cibuildwheel-reusable.yml"
      - ".github/workflows/pure-engines-reusable.yml"
      - ".github/scripts/cibw_run_engines.py"
  push:
    branches:
      - "**" # "*" would skip branch names containing a slash (ci/x, feature/x)
    paths:
      - "pyproject.toml"
      - "py_ballisticcalc/**"
      - "tests/**"
      - "py_ballisticcalc.exts/**"
      - ".gitmodules"
      - ".github/workflows/cibuildwheel-tests.yml"
      - ".github/workflows/cibuildwheel-reusable.yml"
      - ".github/workflows/pure-engines-reusable.yml"
      - ".github/scripts/cibw_run_engines.py"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Full matrix: pull requests (and a manual run)
  full:
    name: ${{ matrix.name }}
    if: github.event_name != 'push'
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        include:
          - name: Linux x64 / x86
            artifact_key: linux-x64-x86
            os: ubuntu-latest
            cibw_archs: "i686,x86_64"
            cibw_platform: linux
            needs_qemu: false

          - name: Linux ARM64 / ARMv7
            artifact_key: linux-arm64-armv7
            os: ubuntu-24.04-arm
            cibw_archs: "aarch64,armv7l"
            cibw_platform: linux
            needs_qemu: false

          - name: Windows x64 / x86
            artifact_key: windows-x64-x86
            os: windows-latest
            cibw_archs: "x86,AMD64"
            cibw_platform: windows
            needs_qemu: false

          - name: Windows ARM64
            artifact_key: windows-arm64
            os: windows-11-arm
            cibw_archs: "ARM64"
            cibw_platform: windows
            needs_qemu: false

          - name: macOS Apple Silicon
            artifact_key: macos-arm64
            os: macos-26
            cibw_archs: "arm64,universal2"
            cibw_platform: macos
            needs_qemu: false

          - name: macOS Intel
            artifact_key: macos-x86_64
            os: macos-26-intel
            cibw_archs: "x86_64"
            cibw_platform: macos
            needs_qemu: false

          # the device wheel is built here too, so that a pull request breaks on it, not the release; nothing can run it, so
          # only the simulator wheel is tested (cibuildwheel tests simulator SDKs only)
          - name: iOS arm64 (device, simulator)
            artifact_key: ios-arm64
            os: macos-26
            cibw_archs: "arm64_iphoneos,arm64_iphonesimulator"
            cibw_platform: ios
            needs_qemu: false
            test_skip: "*_iphoneos"

          - name: iOS simulator x86-64
            artifact_key: ios-x86_64-simulator
            os: macos-26-intel
            cibw_archs: "x86_64_iphonesimulator"
            cibw_platform: ios
            needs_qemu: false

          - name: Android ARM64 / x64
            artifact_key: android-arm64_v8a-x86_64
            os: ubuntu-latest
            cibw_archs: "arm64_v8a,x86_64"
            cibw_platform: android
            needs_qemu: false

          - name: Pyodide WebAssembly
            artifact_key: pyodide-wasm32
            os: ubuntu-latest
            cibw_archs: "wasm32"
            cibw_platform: pyodide
            needs_qemu: false

    uses: ./.github/workflows/cibuildwheel-reusable.yml
    with:
      os: ${{ matrix.os }}
      platform: ${{ matrix.cibw_platform }}
      archs: ${{ matrix.cibw_archs }}
      qemu: ${{ matrix.needs_qemu }}
      test_skip: ${{ matrix.test_skip || '' }}
      artifact_name: tests-wheels-${{ matrix.artifact_key }}
      retention_days: 1

  # The pure-Python and SciPy engines do not depend on the wheel under test, and each of their runs takes minutes (the Cython
  # ones, seconds): so they run once per Python version, on the core wheel, not again for every wheel above.
  core-wheel:
    name: Core wheel (pure Python)
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # setuptools-scm needs history
          submodules: recursive

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d
        with:
          github-token: ${{ github.token }}

      - run: uv build --wheel --out-dir dist .
        shell: bash

      - uses: actions/upload-artifact@v7
        with:
          name: tests-core-wheel
          path: dist/
          retention-days: 1
          if-no-files-found: error

  pure:
    name: Python and SciPy engines, Python ${{ matrix.python }}, ${{ matrix.os }}
    needs: core-wheel
    if: github.event_name != 'push'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.11", "3.14t", "3.15t"]
        include:
          # Windows and macOS once, on the oldest Python, with the engine that has the most Python in it and SciPy's (compiled
          # code, the likeliest to differ in the last digits between platforms)
          - { os: windows-latest, python: "3.11", groups: "python+rk4 scipy" }
          - { os: macos-26, python: "3.11", groups: "python+rk4 scipy" }
    uses: ./.github/workflows/pure-engines-reusable.yml
    with:
      os: ${{ matrix.os }}
      python: ${{ matrix.python }}
      groups: ${{ matrix.groups || 'python scipy' }}
      core_wheel_artifact: tests-core-wheel

  # Minimal matrix: pushes to a branch
  minimal:
    name: Linux x86-64
    if: github.event_name == 'push'
    uses: ./.github/workflows/cibuildwheel-reusable.yml
    with:
      os: ubuntu-latest
      platform: linux
      archs: x86_64
      build: "cp311-*"
      skip: "*-musllinux_*"
      artifact_name: tests-wheels-linux-x86_64
      retention_days: 1
