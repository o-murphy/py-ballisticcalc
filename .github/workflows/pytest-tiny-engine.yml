name: Pytest Tiny Engine
run-name: >
  ${{ github.event_name == 'pull_request' && 'PR' || 'Push' }}
  ${{ github.event.pull_request.number || github.ref_name }}

on:
  pull_request:
    branches:
      - "**" # "*" would skip branch names containing a slash (feature/x, claude/x)
    paths:
      - "pyproject.toml"
      - "py_ballisticcalc/**"
      - "tests/**"
      - "py_ballisticcalc.exts/**"
      - ".gitmodules"
      - ".github/workflows/pytest-tiny-engine.yml"
      - ".github/workflows/pytest-reusable.yml"
      - "examples/tiny_bclibc_ctypes/**"
      - "examples/tiny_bclibc_wasm/**"

  push:
    branches:
      - "**" # "*" would skip branch names containing a slash (feature/x, claude/x)
    paths:
      - "pyproject.toml"
      - "py_ballisticcalc/**"
      - "tests/**"
      - "py_ballisticcalc.exts/**"
      - ".gitmodules"
      - ".github/workflows/pytest-tiny-engine.yml"
      - ".github/workflows/pytest-reusable.yml"
      - "examples/tiny_bclibc_ctypes/**"
      - "examples/tiny_bclibc_wasm/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # tiny-bclibc-wasm (examples/tiny_bclibc_wasm's engine backend), pinned to an exact commit so a
  # push there can't change this job's result. Bump it deliberately, after checking the new commit.
  TINY_BCLIBC_WASM_SHA: dab56de07ef9ee1ab3f07fe1a14cb7328f2afe15 # v0.0.1

jobs:
  # Job for minimal matrix, runs ONLY on push events
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11"]
        include:
          - engine-alias: tiny_bclibc_ctypes
            engine: tiny_bclibc_ctypes:TinyBclibcDoubleIntegrationEngine
          - engine-alias: tiny_bclibc_wasm
            engine: tiny_bclibc_wasm:TinyBclibcWasmDoubleIntegrationEngine

    name: Python ${{ matrix.python-version }} on ${{ matrix.os }} with ${{ matrix.engine-alias }}
    runs-on: ${{ matrix.os }} # The runner's OS is provided by the 'os' input

    steps:
      - uses: actions/checkout@v7
        name: Checkout Repository Code # A clear name for this foundational step
        with:
          fetch-depth: 0 # Required for setuptools-scm
          submodules: recursive

      - name: Install uv and set the python version
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          python-version: ${{ matrix.python-version }} # Use the Python version passed via inputs
          activate-environment: "true"
          github-token: ${{ github.token }}
          enable-cache: true
          # Default glob only tracks uv.lock/pyproject.toml; widen it so the cache
          # key also reflects the exts source tree, so a build is skipped (cache
          # hit) whenever this exact (os, python-version, exts source) combo was
          # already built — e.g. across cython+euler/cython+rk4
          # legs on the same runner, which compile the identical wheel.
          cache-dependency-glob: |
            **/uv.lock
            **/pyproject.toml
            py_ballisticcalc.exts/**
            .gitmodules

      - name: Ensure CI helper scripts executable
        run: chmod +x .github/scripts/ci-helpers.sh
        shell: bash

      - name: Install system dependencies
        run: .github/scripts/ci-helpers.sh install-system-deps ${{ matrix.python-version }} ${{ runner.os }}
        shell: bash

      - name: Install project dependencies
        run: .github/scripts/ci-helpers.sh install-project ${{ matrix.python-version }} ${{ matrix.engine }}
        shell: bash

      - name: Build ${{ matrix.engine-alias }}
        if: matrix.engine-alias == 'tiny_bclibc_ctypes'
        run: |
          cmake -B examples/tiny_bclibc_ctypes/build -S examples/tiny_bclibc_ctypes
          cmake --build examples/tiny_bclibc_ctypes/build
        shell: bash

      # Compiles the .wasm modules from the package's bclibc submodule (uv fetches submodules of git
      # dependencies; the build itself needs only the `ziglang` build requirement). wasmtime is the
      # in-process WebAssembly host.
      - name: Install tiny-bclibc-wasm @ ${{ env.TINY_BCLIBC_WASM_SHA }}
        if: matrix.engine-alias == 'tiny_bclibc_wasm'
        run: uv pip install "tiny-bclibc-wasm @ git+https://github.com/ballistics-lab/tiny-bclibc-wasm-py@${TINY_BCLIBC_WASM_SHA}" wasmtime
        shell: bash

      - name: Run main tests with ${{ matrix.engine }}
        env:
          TINY_BCLIBC_HOST: wasmtime # only read by the wasm engine
          PYBALLISTICCALC_TINY_BCLIBC_LIB: ${{ github.workspace }}/examples/tiny_bclibc_ctypes/build/single/libtiny_bclibc.so
          PYBALLISTICCALC_TINY_BCLIBC_DP_LIB: ${{ github.workspace }}/examples/tiny_bclibc_ctypes/build/double/libtiny_bclibc.so
          PYTHONPATH: examples
        run: .github/scripts/ci-helpers.sh test tests ${{ matrix.engine }}
        shell: bash
