name: Tests (ctypes)
run-name: >-
  ${{ github.event_name == 'push' && format('ctypes: Minimal Matrix — Push {0}', github.ref_name)
  || github.event_name == 'pull_request' && format('ctypes: Full Matrix — PR {0}', github.event.pull_request.number)
  || format('ctypes: Full Matrix — by hand {0}', github.ref_name) }}

# Builds the ctypes package (py_ballisticcalc.ctypes) with cibuildwheel and tests each wheel on its own platform: every engine
# through ctypes (cibuildwheel-reusable.yml, .github/scripts/cibw_run_engines.py), for what the Cython wheels do not serve (PyPy,
# GraalPy, ppc64le, s390x, riscv64) and, as a second variant, for CPython on Linux, macOS, Windows, Android and Pyodide. One
# py3-none wheel per platform, built by one interpreter; the PyPy entries build (and so test) it under PyPy, and GraalPy has
# jobs of its own (see the matrix, .github/matrices.yml). Each QEMU architecture is a job of its own (glibc and musl in it), so the three run in parallel.
# A pull request runs every platform; a push to a branch runs one Linux job; a run by hand (workflow_dispatch) runs every
# platform, as a pull request does. It does not run, or wait for, the Cython jobs (tests-exts.yml).
on:
  pull_request:
    branches:
      - "**"
    paths:
      - "pyproject.toml"
      - "py_ballisticcalc/**"
      - "tests/**"
      - "py_ballisticcalc.ctypes/**"
      - "py_ballisticcalc.exts/py_ballisticcalc_exts/external/bclibc" # the one bclibc submodule the library is built from
      - ".gitmodules"
      - ".github/workflows/tests-ctypes.yml"
      - ".github/workflows/cibuildwheel-reusable.yml"
      - ".github/scripts/cibw_run_engines.py"
      - ".github/matrices.yml"
      - ".github/actions/wheel-matrix/**"
      - ".github/scripts/wheel_matrix.py"
  push:
    branches:
      - "**" # "*" would skip branch names containing a slash (ci/x, feature/x)
    paths:
      - "pyproject.toml"
      - "py_ballisticcalc/**"
      - "tests/**"
      - "py_ballisticcalc.ctypes/**"
      - "py_ballisticcalc.exts/py_ballisticcalc_exts/external/bclibc"
      - ".gitmodules"
      - ".github/workflows/tests-ctypes.yml"
      - ".github/workflows/cibuildwheel-reusable.yml"
      - ".github/scripts/cibw_run_engines.py"
      - ".github/matrices.yml"
      - ".github/actions/wheel-matrix/**"
      - ".github/scripts/wheel_matrix.py"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The matrix is in .github/matrices.yml (the list of platforms is long and some are in more than one workflow)
  wheel_matrix:
    name: Wheel matrix
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.read.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github
      - id: read
        uses: ./.github/actions/wheel-matrix
        with:
          matrix: ctypes

  # Full matrix: pull requests (and a manual run)
  full:
    name: ${{ matrix.name }}
    needs: wheel_matrix
    if: github.event_name != 'push'
    strategy:
      fail-fast: false
      # `cp3*` selects the CPython identifiers only (the project enables PyPy and GraalPy too): one builds the py3-none wheel, the others
      # reuse it and test it on their Python, as for the abi3 wheels of exts.
      # GraalPy on Windows (3.13 only) has a job of its own in the matrix (.github/matrices.yml): it builds with the plain `build` frontend (uv 0.13 cannot inspect graalpy.exe: ctypes.ArgumentError in VirtualAlloc) and runs the tests without pytest-xdist
      max-parallel: 20 # every entry at once; the QEMU ones are the slowest
      matrix: ${{ fromJSON(needs.wheel_matrix.outputs.matrix) }}

    uses: ./.github/workflows/cibuildwheel-reusable.yml
    with:
      project: py_ballisticcalc.ctypes
      os: ${{ matrix.os }}
      platform: ${{ matrix.cibw_platform }}
      archs: ${{ matrix.cibw_archs }}
      build: ${{ matrix.build || '' }}
      qemu: ${{ matrix.needs_qemu }}
      timeout_minutes: ${{ matrix.timeout_minutes || 360 }}
      artifact_name: ctypes-wheels-${{ matrix.artifact_key }}
      retention_days: 1

  # Minimal matrix: pushes to a branch
  minimal:
    name: Linux x86-64
    if: github.event_name == 'push'
    uses: ./.github/workflows/cibuildwheel-reusable.yml
    with:
      project: py_ballisticcalc.ctypes
      os: ubuntu-latest
      platform: linux
      archs: x86_64
      build: "cp311-*"
      skip: "*-musllinux_*"
      artifact_name: ctypes-wheels-linux-x86_64
      retention_days: 1
