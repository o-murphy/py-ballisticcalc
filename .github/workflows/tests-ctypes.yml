name: Tests (ctypes)
run-name: >-
  ${{ github.event_name == 'push' && format('ctypes: Minimal Matrix — Push {0}', github.ref_name)
  || github.event_name == 'pull_request' && format('ctypes: Full Matrix — PR {0}', github.event.pull_request.number)
  || github.event_name == 'schedule' && format('ctypes: Night Matrix (QEMU) — {0}', github.ref_name)
  || format('ctypes: Full Matrix — by hand {0}', github.ref_name) }}

# Builds the ctypes package (py_ballisticcalc.ctypes) with cibuildwheel and tests each wheel on its own platform: every engine
# through ctypes (cibuildwheel-reusable.yml, .github/scripts/cibw_run_engines.py), for what the Cython wheels do not serve (PyPy,
# GraalPy, ppc64le, s390x, riscv64) and, as a second variant, for CPython on Linux, macOS, Windows, Android and Pyodide. One
# py3-none wheel per platform, built by one interpreter; the PyPy entries build (and so test) it under PyPy, and GraalPy has
# jobs of its own (see the matrix, .github/matrices.yml). It does not run, or wait for, the Cython jobs (tests-exts.yml).
#
# A pull request runs every platform. The QEMU ones (ppc64le, s390x, riscv64) take an hour or more each, nearly all of it the tests (84
# sessions under emulation; the build is a few minutes), so for a pull request they build the wheel and run a smoke test only (one
# Python, two engines, the `smoke` of their entries in .github/matrices.yml). Their whole tests are run by hand (workflow_dispatch,
# with `qemu` on) and by the schedule, every night on the default branch, which is skipped when nothing the workflow tests has changed
# since the last successful night run (.github/scripts/changed_since_last_run.py). A push to a branch runs one Linux job. A run by
# hand and a night run have a concurrency group of their own, so that a push does not cancel an hour of QEMU.
on:
  pull_request:
    branches:
      - "**"
    paths:
      - "pyproject.toml"
      - "py_ballisticcalc/**"
      - "tests/**"
      - "py_ballisticcalc.ctypes/**"
      - "py_ballisticcalc.exts/py_ballisticcalc_exts/external/bclibc" # the one bclibc submodule the library is built from
      - ".gitmodules"
      - ".github/workflows/tests-ctypes.yml"
      - ".github/workflows/cibuildwheel-reusable.yml"
      - ".github/scripts/cibw_run_engines.py"
      - ".github/matrices.yml"
      - ".github/actions/wheel-matrix/**"
      - ".github/scripts/wheel_matrix.py"
  push:
    branches:
      - "**" # "*" would skip branch names containing a slash (ci/x, feature/x)
    paths:
      - "pyproject.toml"
      - "py_ballisticcalc/**"
      - "tests/**"
      - "py_ballisticcalc.ctypes/**"
      - "py_ballisticcalc.exts/py_ballisticcalc_exts/external/bclibc"
      - ".gitmodules"
      - ".github/workflows/tests-ctypes.yml"
      - ".github/workflows/cibuildwheel-reusable.yml"
      - ".github/scripts/cibw_run_engines.py"
      - ".github/matrices.yml"
      - ".github/actions/wheel-matrix/**"
      - ".github/scripts/wheel_matrix.py"
  schedule:
    - cron: "17 4 * * *" # every night, UTC (06:17 or 07:17 in Kyiv); a schedule runs the default branch only. Not on the hour: GitHub delays
    # the scheduled runs at the start of every hour, when most of them start
  workflow_dispatch:
    inputs:
      qemu:
        description: "Test the QEMU jobs in full (ppc64le, s390x, riscv64: an hour or more each); off: a build and a smoke test, as in a pull request"
        required: false
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ (github.event_name == 'push' || github.event_name == 'pull_request') && 'ci' || github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The night run only: is there anything new to test since the last successful night run?
  changes:
    name: Changes since the last night run
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read # the last successful run is looked up with gh
    outputs:
      skip: ${{ steps.changes.outputs.skip }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the commits to compare
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          github-token: ${{ github.token }}
      - id: changes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: uv run --no-project --with pyyaml==6.0.3 python .github/scripts/changed_since_last_run.py tests-ctypes.yml
        shell: bash

  # The matrix is in .github/matrices.yml (the list of platforms is long and some are in more than one workflow)
  wheel_matrix:
    name: Wheel matrix
    needs: changes
    # `changes` runs by the schedule only: without !cancelled() the job would be skipped with it. A night run with nothing new skips it
    if: ${{ !cancelled() && github.event_name != 'push' && needs.changes.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.read.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github
      - id: read
        uses: ./.github/actions/wheel-matrix
        with:
          matrix: ctypes
          # the QEMU entries are tested in full by the schedule, and by hand when asked (the input `qemu`); otherwise a build and a smoke test
          smoke: ${{ !(github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.qemu)) }}

  # Full matrix: pull requests, a manual run and the night run
  full:
    name: ${{ matrix.name }}
    needs: wheel_matrix
    # !cancelled(): `changes` (the night run only) is skipped in the other runs, and a skipped job up the chain skips this one
    # through the implicit success() of an `if` without a status function
    if: ${{ !cancelled() && needs.wheel_matrix.result == 'success' && github.event_name != 'push' }}
    strategy:
      fail-fast: false
      # `cp3*` selects the CPython identifiers only (the project enables PyPy and GraalPy too): one builds the py3-none wheel, the others
      # reuse it and test it on their Python, as for the abi3 wheels of exts.
      # GraalPy on Windows (3.13 only) has a job of its own in the matrix (.github/matrices.yml): it builds with the plain `build` frontend (uv 0.13 cannot inspect graalpy.exe: ctypes.ArgumentError in VirtualAlloc) and runs the tests without pytest-xdist
      max-parallel: 20 # every entry at once; the QEMU ones are the slowest
      matrix: ${{ fromJSON(needs.wheel_matrix.outputs.matrix) }}

    uses: ./.github/workflows/cibuildwheel-reusable.yml
    with:
      project: py_ballisticcalc.ctypes
      os: ${{ matrix.os }}
      platform: ${{ matrix.cibw_platform }}
      archs: ${{ matrix.cibw_archs }}
      build: ${{ matrix.build || '' }}
      test_command: ${{ matrix.test_command || '' }}
      qemu: ${{ matrix.needs_qemu }}
      timeout_minutes: ${{ matrix.timeout_minutes || 360 }}
      artifact_name: ctypes-wheels-${{ matrix.artifact_key }}
      retention_days: 1

  # Minimal matrix: pushes to a branch
  minimal:
    name: Linux x86-64
    if: github.event_name == 'push'
    uses: ./.github/workflows/cibuildwheel-reusable.yml
    with:
      project: py_ballisticcalc.ctypes
      os: ubuntu-latest
      platform: linux
      archs: x86_64
      build: "cp311-*"
      skip: "*-musllinux_*"
      artifact_name: ctypes-wheels-linux-x86_64
      retention_days: 1
