name: Tests (ctypes)
run-name: "ctypes: ${{ github.event_name == 'workflow_dispatch' && 'by hand' || github.ref_name }}"

# Builds the ctypes package (py_ballisticcalc.ctypes) with cibuildwheel and tests each wheel: the engines through ctypes for
# what the Cython wheels do not serve (PyPy, GraalPy, ppc64le, s390x, riscv64) and, as a second variant, for Android. One
# py3-none wheel per platform, built by one interpreter; the PyPy and GraalPy entries build (and so test) it under those
# interpreters. Each QEMU architecture is a job of its own (glibc and musl in it), so the three run in parallel. It does not run, or wait for, the Cython jobs (cibuildwheel-tests.yml).
#
# By hand (workflow_dispatch); GitHub starts a workflow by hand only when its file is on the default branch, so until this
# one is merged it also starts on a push to a feat/ctypes-* branch (remove that trigger afterwards).
on:
  workflow_dispatch:
  push:
    branches:
      - "feat/ctypes-*"
    paths:
      - "py_ballisticcalc.ctypes/**"
      - ".github/workflows/ctypes-tests.yml"
      - ".github/workflows/cibuildwheel-reusable.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      max-parallel: 20 # every entry at once; the QEMU ones are the slowest
      matrix:
        include:
          - name: Linux x64 / x86 (glibc, musl)
            artifact_key: linux-x64-x86
            os: ubuntu-latest
            cibw_archs: "x86_64,i686"
            cibw_platform: linux
            needs_qemu: false

          - name: Linux ARM64 / ARMv7 (glibc, musl)
            artifact_key: linux-arm64-armv7
            os: ubuntu-24.04-arm
            cibw_archs: "aarch64,armv7l"
            cibw_platform: linux
            needs_qemu: false

          - name: Linux ppc64le (QEMU, glibc and musl)
            artifact_key: linux-ppc64le
            os: ubuntu-latest
            cibw_archs: "ppc64le"
            cibw_platform: linux
            needs_qemu: true

          - name: Linux s390x (QEMU, glibc and musl)
            artifact_key: linux-s390x
            os: ubuntu-latest
            cibw_archs: "s390x"
            cibw_platform: linux
            needs_qemu: true

          - name: Linux riscv64 (QEMU, glibc and musl)
            artifact_key: linux-riscv64
            os: ubuntu-latest
            cibw_archs: "riscv64"
            cibw_platform: linux
            needs_qemu: true

          - name: Windows x64
            artifact_key: windows-x64
            os: windows-latest
            cibw_archs: "AMD64"
            cibw_platform: windows
            needs_qemu: false

          - name: macOS Apple Silicon (universal2)
            artifact_key: macos-universal2
            os: macos-26
            cibw_archs: "universal2"
            cibw_platform: macos
            needs_qemu: false

          - name: macOS Intel
            artifact_key: macos-x86_64
            os: macos-26-intel
            cibw_archs: "x86_64"
            cibw_platform: macos
            needs_qemu: false

          - name: Android (x86-64 emulator, arm64 build)
            artifact_key: android
            os: ubuntu-latest
            cibw_archs: "arm64_v8a,x86_64"
            cibw_platform: android
            needs_qemu: false

          - name: PyPy Linux x86-64
            artifact_key: pypy-linux-x86_64
            os: ubuntu-latest
            cibw_archs: "x86_64"
            cibw_platform: linux
            needs_qemu: false
            build: "pp311-manylinux_x86_64"

          - name: PyPy Linux ARM64
            artifact_key: pypy-linux-aarch64
            os: ubuntu-24.04-arm
            cibw_archs: "aarch64"
            cibw_platform: linux
            needs_qemu: false
            build: "pp311-manylinux_aarch64"

          - name: PyPy macOS Intel
            artifact_key: pypy-macos-x86_64
            os: macos-26-intel
            cibw_archs: "x86_64"
            cibw_platform: macos
            needs_qemu: false
            build: "pp311-macosx_x86_64"

          - name: PyPy Windows x64
            artifact_key: pypy-windows-x64
            os: windows-latest
            cibw_archs: "AMD64"
            cibw_platform: windows
            needs_qemu: false
            build: "pp311-win_amd64"

          - name: GraalPy Linux x86-64
            artifact_key: graalpy-linux-x86_64
            os: ubuntu-latest
            cibw_archs: "x86_64"
            cibw_platform: linux
            needs_qemu: false
            build: "gp312_250-manylinux_x86_64"

          - name: GraalPy Linux ARM64
            artifact_key: graalpy-linux-aarch64
            os: ubuntu-24.04-arm
            cibw_archs: "aarch64"
            cibw_platform: linux
            needs_qemu: false
            build: "gp312_250-manylinux_aarch64"

          - name: GraalPy macOS Intel
            artifact_key: graalpy-macos-x86_64
            os: macos-26-intel
            cibw_archs: "x86_64"
            cibw_platform: macos
            needs_qemu: false
            build: "gp312_250-macosx_x86_64"

          - name: GraalPy Windows x64
            artifact_key: graalpy-windows-x64
            os: windows-latest
            cibw_archs: "AMD64"
            cibw_platform: windows
            needs_qemu: false
            build: "gp312_250-win_amd64"

    uses: ./.github/workflows/cibuildwheel-reusable.yml
    with:
      project: py_ballisticcalc.ctypes
      os: ${{ matrix.os }}
      platform: ${{ matrix.cibw_platform }}
      archs: ${{ matrix.cibw_archs }}
      build: ${{ matrix.build || '' }}
      qemu: ${{ matrix.needs_qemu }}
      artifact_name: ctypes-wheels-${{ matrix.artifact_key }}
      retention_days: 1
