name: Coverage

on:
  push:
    branches:
      - "master"
    paths:
      - "pyproject.toml"
      - "py_ballisticcalc/**"
      - "py_ballisticcalc.exts/**"
      - "py_ballisticcalc.ctypes/**"
      - "tests/**"
      - ".github/workflows/coverage.yml"
  pull_request:
    branches:
      - "*"
    paths:
      - "pyproject.toml"
      - "py_ballisticcalc/**"
      - "py_ballisticcalc.exts/**"
      - "py_ballisticcalc.ctypes/**"
      - "tests/**"
      - ".github/workflows/coverage.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  discover-engines:
    if: github.actor != 'dependabot[bot]' # dependabot PRs get coverage from the base branch; skip the redundant full run
    runs-on: ubuntu-latest
    outputs:
      engines: ${{ steps.list.outputs.engines }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive # required to see py_ballisticcalc.exts entry points

      - name: Install uv and set the python version
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          python-version: "3.11"
          activate-environment: "true"
          github-token: ${{ github.token }}

      - name: Install the project (all engines)
        run: uv sync --dev --extra exts --extra scipy
        shell: bash

      - name: List available engines
        id: list
        run: |
          engines=$(uv run python -c "
          import json
          from py_ballisticcalc import Calculator, _EngineLoader
          print(json.dumps(sorted(_EngineLoader.engine_id(ep) for ep in Calculator.iter_engines())))
          ")
          echo "engines=$engines" >> "$GITHUB_OUTPUT"
        shell: bash

  test:
    needs: discover-engines
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        engine: ${{ fromJSON(needs.discover-engines.outputs.engines) }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # required for setuptools-scm
          submodules: recursive # required to build py_ballisticcalc.exts

      - name: Install uv and set the python version
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          python-version: "3.11"
          activate-environment: "true"
          github-token: ${{ github.token }}

      - name: Install the project
        run: |
          if [[ "${{ matrix.engine }}" == cython[+.]* ]]; then
            uv sync --dev --extra scipy --extra exts
          else
            uv sync --dev --extra scipy
          fi
        shell: bash

      - name: Run coverage
        # Cython extension internals (.pyx) aren't line-traced here (uv builds
        # them in an isolated dir with no persistent C sources to map back to);
        # this still measures how much of the pure-Python package each engine exercises.
        run: >
          uv run pytest
          --cov=py_ballisticcalc
          --cov-report=
          --engine=${{ matrix.engine }}
        shell: bash
        env:
          COVERAGE_FILE: .coverage.${{ matrix.engine }}

      - name: Upload coverage data
        if: ${{ !cancelled() }} # keep coverage data even if this engine's tests fail
        uses: actions/upload-artifact@v7
        with:
          name: coverage-data-${{ matrix.engine }}
          path: .coverage.${{ matrix.engine }}
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error

  # The ctypes engines: the Python side of py_ballisticcalc_ctypes (the engines, the glue over the shared library) is measured, like
  # the pure-Python side of the package for the Cython engines; the library itself is C++ and is not line-traced. The package is
  # installed editable (the library is built by setup.py into the source tree), so the report maps to the files of the repository;
  # `uv run --no-sync` keeps it from being removed. The engines are named by class (`py_ballisticcalc_ctypes:Native<Method>IntegrationEngine`), as `ctypes+<method>` would do.
  test-ctypes:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { method: euler, cls: Euler }
          - { method: rk4, cls: RK4 }
          - { method: verlet, cls: VelocityVerlet }
          - { method: rkck, cls: CashKarp }
          - { method: dopri, cls: DormandPrince }
          - { method: tsitouras, cls: Tsitouras }

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # required for setuptools-scm
          submodules: recursive # the bclibc sources the library is built from

      - name: Install uv and set the python version
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          python-version: "3.11"
          activate-environment: "true"
          github-token: ${{ github.token }}

      - name: Install the project and the ctypes package
        run: |
          uv sync --dev --extra scipy
          uv pip install -e ./py_ballisticcalc.ctypes
        shell: bash

      - name: Run coverage
        run: >
          uv run --no-sync pytest tests py_ballisticcalc.ctypes/tests
          --cov=py_ballisticcalc
          --cov=py_ballisticcalc_ctypes
          --cov-report=
          --engine=py_ballisticcalc_ctypes:Native${{ matrix.cls }}IntegrationEngine
        shell: bash
        env:
          COVERAGE_FILE: .coverage.ctypes-${{ matrix.method }}

      - name: Upload coverage data
        if: ${{ !cancelled() }} # keep coverage data even if this engine's tests fail
        uses: actions/upload-artifact@v7
        with:
          name: coverage-data-ctypes-${{ matrix.method }}
          path: .coverage.ctypes-${{ matrix.method }}
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error

  merge:
    needs: [test, test-ctypes]
    # !cancelled() alone would still run this even when `test` was skipped (dependabot actor), since a
    # skipped job isn't a cancelled one; the actor check keeps it skipped in that case too
    if: ${{ !cancelled() && github.actor != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # required for setuptools-scm

      - name: Install uv and set the python version
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          python-version: "3.11"
          activate-environment: "true"
          github-token: ${{ github.token }}

      - name: Install the project
        run: uv sync --dev
        shell: bash

      - name: Download coverage data
        uses: actions/download-artifact@v8
        with:
          pattern: coverage-data-*
          merge-multiple: true

      - name: Combine coverage
        run: |
          uv run coverage combine
          uv run coverage xml
          uv run coverage html
        shell: bash

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          use_oidc: true
          files: ./coverage.xml
          fail_ci_if_error: true
