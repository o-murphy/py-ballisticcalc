name: Pure-Python and SciPy engines (reusable)

# The engines that do not depend on a wheel under test (python+*, scipy+*) are run here, once for a Python version, on the
# core wheel built from this checkout: each run takes minutes (the Cython engines, which cibuildwheel tests, seconds).
# The runner is .github/scripts/cibw_run_engines.py, the dependencies are the `test` group of py_ballisticcalc.exts, and no
# extension is built.
on:
  workflow_call:
    inputs:
      python:
        description: 'Python version for uv, e.g. "3.11" or "3.14t" (free-threaded)'
        required: true
        type: string
      os:
        description: "Runner (runs-on)"
        required: false
        type: string
        default: ubuntu-latest
      core_wheel_artifact:
        description: "Artifact (of this run) holding the core wheel, a py_ballisticcalc-*.whl; empty: build it here"
        required: false
        type: string
        default: ""
      groups:
        description: 'Engines to run, separated by spaces: groups (python, scipy) or engine names (python+rk4)'
        required: false
        type: string
        default: "python scipy"
      timeout_minutes:
        description: "Job timeout in minutes"
        required: false
        type: number
        default: 120

permissions:
  contents: read

jobs:
  engines:
    name: Python and SciPy engines, Python ${{ inputs.python }}, ${{ inputs.os }}
    runs-on: ${{ inputs.os }}
    timeout-minutes: ${{ inputs.timeout_minutes }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # setuptools-scm needs history
          submodules: recursive

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d
        with:
          github-token: ${{ github.token }}

      # What the runner expects next to it: the tests and the core wheel (see .github/scripts/cibw_run_engines.py)
      - name: Stage dir
        run: echo "STAGE=$RUNNER_TEMP/stage" >> "$GITHUB_ENV"
        shell: bash

      # The core wheel is pure Python, the same for every Python and OS: the caller builds it once and the jobs take it
      - name: Get the core wheel
        if: ${{ inputs.core_wheel_artifact != '' }}
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.core_wheel_artifact }}
          path: ${{ env.STAGE }}/cibw_stage/core-wheel

      - name: Build the core wheel
        if: ${{ inputs.core_wheel_artifact == '' }}
        run: uv build --wheel --out-dir "$STAGE/cibw_stage/core-wheel" .
        shell: bash

      - name: Stage the tests and the runner
        run: |
          cp -R tests "$STAGE/cibw_stage/tests"
          cp .github/scripts/cibw_run_engines.py "$STAGE/"
          ls "$STAGE/cibw_stage/core-wheel"
        shell: bash

      # The same dependency group the wheels are tested with (numpy and scipy included), no extension is built
      - name: Install the test dependencies
        run: |
          uv venv --python ${{ inputs.python }} .venv-pure
          # the interpreter of the venv: Scripts/ on Windows, bin/ elsewhere
          if [ "$RUNNER_OS" = "Windows" ]; then VENV_PYTHON=".venv-pure/Scripts/python.exe"; else VENV_PYTHON=".venv-pure/bin/python"; fi
          uv pip install --python "$VENV_PYTHON" --group py_ballisticcalc.exts/pyproject.toml:test
          echo "VENV_PYTHON=$GITHUB_WORKSPACE/$VENV_PYTHON" >> "$GITHUB_ENV"
        shell: bash

      # Variables, not ${{ }}, in the command: on Windows the paths have backslashes, which bash would take for escapes
      - name: Run the engines
        working-directory: ${{ env.STAGE }}
        env:
          GROUPS_TO_RUN: ${{ inputs.groups }}
        run: |
          # shellcheck disable=SC2086 -- the groups are a list separated by spaces
          "$VENV_PYTHON" cibw_run_engines.py $GROUPS_TO_RUN
        shell: bash
