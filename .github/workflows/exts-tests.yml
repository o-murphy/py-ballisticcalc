name: Tests (exts)
run-name: >-
  ${{ github.event_name == 'push' && format('exts: Minimal Matrix — Push {0}', github.ref_name)
  || github.event_name == 'pull_request' && format('exts: Full Matrix — PR {0}', github.event.pull_request.number)
  || format('exts: Full Matrix — by hand {0}', github.ref_name) }}

# Builds the Cython wheels (py_ballisticcalc.exts) with cibuildwheel and tests each of them on its own platform: every Cython
# engine, one after another (cibuildwheel-reusable.yml, .github/scripts/cibw_run_engines.py). A pull request runs every platform; a
# push to a branch runs one Linux job; a run by hand (workflow_dispatch) runs every platform, as a pull request does. The matrix is in
# .github/matrices.yml. The release (pypi-publish.yml) builds the same wheels without tests: they run here. The tests of the core (the
# pure-Python and SciPy engines) are in pure-tests.yml, those of the ctypes wheels in ctypes-tests.yml.
on:
  pull_request:
    branches:
      - "**"
    paths:
      - "pyproject.toml"
      - "py_ballisticcalc/**"
      - "tests/**"
      - "py_ballisticcalc.exts/**"
      - ".gitmodules"
      - ".github/workflows/exts-tests.yml"
      - ".github/workflows/cibuildwheel-reusable.yml"
      - ".github/scripts/cibw_run_engines.py"
      - ".github/matrices.yml"
      - ".github/actions/wheel-matrix/**"
      - ".github/scripts/wheel_matrix.py"
  push:
    branches:
      - "**" # "*" would skip branch names containing a slash (ci/x, feature/x)
    paths:
      - "pyproject.toml"
      - "py_ballisticcalc/**"
      - "tests/**"
      - "py_ballisticcalc.exts/**"
      - ".gitmodules"
      - ".github/workflows/exts-tests.yml"
      - ".github/workflows/cibuildwheel-reusable.yml"
      - ".github/scripts/cibw_run_engines.py"
      - ".github/matrices.yml"
      - ".github/actions/wheel-matrix/**"
      - ".github/scripts/wheel_matrix.py"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The matrix is in .github/matrices.yml (the list of platforms is long and some are in more than one workflow)
  wheel_matrix:
    name: Wheel matrix
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.read.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github
      - id: read
        uses: ./.github/actions/wheel-matrix
        with:
          matrix: exts-tests

  # Full matrix: pull requests (and a manual run)
  full:
    name: ${{ matrix.name }}
    needs: wheel_matrix
    if: github.event_name != 'push'
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix: ${{ fromJSON(needs.wheel_matrix.outputs.matrix) }}

    uses: ./.github/workflows/cibuildwheel-reusable.yml
    with:
      os: ${{ matrix.os }}
      platform: ${{ matrix.cibw_platform }}
      archs: ${{ matrix.cibw_archs }}
      qemu: ${{ matrix.needs_qemu }}
      test_skip: ${{ matrix.test_skip || '' }}
      artifact_name: tests-wheels-${{ matrix.artifact_key }}
      retention_days: 1

  # Minimal matrix: pushes to a branch
  minimal:
    name: Linux x86-64
    if: github.event_name == 'push'
    uses: ./.github/workflows/cibuildwheel-reusable.yml
    with:
      os: ubuntu-latest
      platform: linux
      archs: x86_64
      build: "cp311-*"
      skip: "*-musllinux_*"
      artifact_name: tests-wheels-linux-x86_64
      retention_days: 1
