[build-system]
requires = [
    "setuptools>=84.0",
    "setuptools-scm",
    "cython>=3.2.9"
]
build-backend = "setuptools.build_meta"


[project]
name = "py_ballisticcalc.exts"
authors = [
    { name="o-murphy", email="thehelixpg@gmail.com" },
    { name="dbookstaber", email="bookstaber@gmail.com"}
]
description = "LGPL library for small arms ballistic calculations (Python 3)"
readme = "README.md"
requires-python = ">=3.11"
keywords = ["py_ballisticcalc", "ballistics", "Cython", "ballistic calculator", "python", "python3"]
#license = {file = "LICENSE"}
classifiers = [
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Programming Language :: Python",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: Implementation :: CPython",
]
dependencies = []

# NOTE:
#   version: will be calculated with setuptools-scm
dynamic = ["version"]

# Legacy flat group (temporary, kept for backward compatibility)
[project.entry-points.py_ballisticcalc]
cythonized_euler_engine = "py_ballisticcalc_exts:CythonizedEulerIntegrationEngine"
cythonized_rk4_engine = "py_ballisticcalc_exts:CythonizedRK4IntegrationEngine"
cythonized_verlet_engine = "py_ballisticcalc_exts:CythonizedVelocityVerletIntegrationEngine"
cythonized_rkck_engine = "py_ballisticcalc_exts:CythonizedCashKarpIntegrationEngine"
cythonized_dopri_engine = "py_ballisticcalc_exts:CythonizedDormandPrinceIntegrationEngine"
cythonized_tsitouras_engine = "py_ballisticcalc_exts:CythonizedTsitourasIntegrationEngine"

[project.entry-points."py_ballisticcalc.engines.cython"]
euler = "py_ballisticcalc_exts:CythonizedEulerIntegrationEngine"
rk4 = "py_ballisticcalc_exts:CythonizedRK4IntegrationEngine"
verlet = "py_ballisticcalc_exts:CythonizedVelocityVerletIntegrationEngine"
rkck = "py_ballisticcalc_exts:CythonizedCashKarpIntegrationEngine"
dopri = "py_ballisticcalc_exts:CythonizedDormandPrinceIntegrationEngine"
tsitouras = "py_ballisticcalc_exts:CythonizedTsitourasIntegrationEngine"

[project.urls]
"Homepage" = "https://github.com/o-murphy/py-ballisticcalc"
"Bug Reports" = "https://github.com/o-murphy/py-ballisticcalc/issues"
"Source" = "https://github.com/o-murphy/py-ballisticcalc"


[tool.setuptools]
py-modules = ["py_ballisticcalc_exts"]

[tool.setuptools.package-data]
py_ballisticcalc_exts = [
    "py.typed",
    "include/bclibc/*.hpp",
    "src/*.cpp",
    "external/bclibc/include/bclibc/*.hpp",
    "external/bclibc/include/bclibc/ffi/*.h",
    "external/bclibc/src/*.cpp",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["py_ballisticcalc_exts*"]
exclude = ["py_ballisticcalc_exts.include*", "py_ballisticcalc_exts.external*"]

[project.optional-dependencies]
dev = [
    "cython>=3.2.9",
    "cython-lint>=0.21.0",
]

[tool.cibuildwheel]
# Use uv and build
build-frontend = "build[uv]"
# cp311-abi3 covers standard CPython 3.11+ (incl. 3.15); free-threaded builds (cp314t-*, cp315t-*) are
# built separately because Py_LIMITED_API and Py_GIL_DISABLED are mutually incompatible.
# abi3t (PEP 803) is not used: Cython 3.3 has no stable support for it yet (cython/cython#7399).
# cp315t-* is a CPython prerelease until 3.15 final, hence the explicit enable.
build = "cp311-* cp314t-* cp315t-*"
enable = ["cpython-prerelease"]
# Tests: after each wheel is built, cibuildwheel installs it in a clean environment and runs every engine of the core
# test suite there, one after another (.github/scripts/cibw_run_engines.py). The workflow cibuildwheel-reusable.yml
# stages cibw_stage/ (the core tests, the core wheel, the runner) in this folder; it is not committed.
test-sources = ["cibw_stage"]
# typing_extensions and Deprecated are the core's own dependencies; numpy and scipy are its `scipy` extra (the same
# bounds), for the scipy engines. Where scipy has no wheel the overrides below leave them out, and the runner then
# leaves the scipy engines out too.
test-requires = [
    "pytest",
    "pytest-xdist",
    "typing_extensions>=4.15.0",
    "Deprecated>=1.3.1",
    "numpy>=2.5.0; python_version >= '3.12'",
    "numpy>=2.4.6; python_version < '3.12'",
    "scipy>=1.18.0; python_version >= '3.12'",
    "scipy>=1.17.1; python_version < '3.12'",
]
test-command = "python cibw_stage/cibw_run_engines.py"

# No scipy wheels. PyPI has them only for macOS (x86_64, arm64), manylinux and musllinux (x86_64, aarch64) and Windows
# (AMD64, ARM64), for CPython 3.11 up to 3.15 including the free-threaded builds (checked against scipy 1.17.1 and
# 1.18.1); none for 32-bit Windows, i686, armv7l, ppc64le, s390x, riscv64, and Pyodide takes its packages from
# elsewhere. Android and iOS are not tested at all, see below. The same list without numpy and scipy.
[[tool.cibuildwheel.overrides]]
select = ["*-win32", "*_i686", "*_armv7l", "*_ppc64le", "*_s390x", "*_riscv64", "*-pyodide_*"]
test-requires = ["pytest", "pytest-xdist", "typing_extensions>=4.15.0", "Deprecated>=1.3.1"]

[tool.cibuildwheel.android]
build = "cp313-android_* cp314-android_* cp315-android_*"
# Android and iOS accept only a restricted form of test command: those wheels are built, not tested, here
test-command = ""

[tool.cibuildwheel.pyodide]
build = "cp313-pyodide_* cp314-pyodide_* cp315-pyodide_*"

[tool.cibuildwheel.ios]
test-command = ""

[tool.cibuildwheel.linux]
# Docker's default seccomp profile on the Ubuntu 26.04 runners refuses 32-bit socket calls: uv panics
# (tokio UnixStream, ENOSYS) and pip cannot reach the index in the i686 container. Run the Linux containers
# with seccomp unconfined (the same fix natify-sh/waboros uses).
container-engine = { name = "docker", create-args = ["--security-opt", "seccomp=unconfined"] }

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-m 'not stress'"
markers = ["stress: long-running or resource-intensive tests, opt-in only"]

# uv rebuilds this package only when one of these files changes (replaces the defaults,
# so build config files are listed explicitly). Paths are relative to this directory.
[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "setup.py" },
    { file = "py_ballisticcalc_exts/**/*.{pyx,pxd,pyi,py}" },
    { file = "py_ballisticcalc_exts/src/**/*.{cpp,hpp,h}" },
    { file = "py_ballisticcalc_exts/include/**/*.{cpp,hpp,h}" },
    { file = "py_ballisticcalc_exts/external/**/*.{cpp,hpp,h}" },
    # build flags read by setup.py
    { env = "CYTHON_COVERAGE" },
    { env = "CYTHON_SAFETY" },
    { env = "CYTHON_FORCE_REGEN" },
    { env = "DISABLE_SHARED_STRIP" },
    # version (setuptools-scm) must match the core package, which is re-resolved on every commit
    { git = { commit = true } },
]

[tool.setuptools_scm]
root = ".."  # required for valid .git repo root detect for subpackage in monorepo
fallback_version = "0.0.0.dev0"

[dependency-groups]
dev = [
    "cibuildwheel>=4.1.1",
    "cython>=3.2.9",
]
