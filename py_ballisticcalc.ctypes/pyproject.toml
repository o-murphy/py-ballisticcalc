[build-system]
requires = [
    "setuptools>=84.0",
    "setuptools-scm",
]
build-backend = "setuptools.build_meta"

[project]
name = "py_ballisticcalc.ctypes"
authors = [
    { name="o-murphy", email="thehelixpg@gmail.com" },
    { name="dbookstaber", email="bookstaber@gmail.com"}
]
description = "bclibc engines of py_ballisticcalc through ctypes: for the interpreters the Cython extensions cannot serve (PyPy, GraalPy) and the platforms they are not built for"
readme = "README.md"
requires-python = ">=3.11"
keywords = ["py_ballisticcalc", "ballistics", "ctypes", "ballistic calculator", "python", "python3"]
classifiers = [
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Programming Language :: Python",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Programming Language :: Python :: Implementation :: GraalPy",
]
# LGPL-3.0, as the main package and the extensions; the ctypesgen runtime this package ships (_ctypesgen/ctypes_loader.py and
# ctypes_preamble.py) is BSD-licensed and carries its own license text
license-files = ["LICENSE", "py_ballisticcalc_ctypes/_ctypesgen/LICENSE"]
dependencies = []

# NOTE:
#   version: will be calculated with setuptools-scm, the same as the main package and the extensions
dynamic = ["version"]

# The same engines as the Cython extensions (py_ballisticcalc.exts), under the same names, through ctypes. Install one of the two.
[project.entry-points.py_ballisticcalc]
cythonized_euler_engine = "py_ballisticcalc_ctypes:NativeEulerIntegrationEngine"
cythonized_rk4_engine = "py_ballisticcalc_ctypes:NativeRK4IntegrationEngine"
cythonized_verlet_engine = "py_ballisticcalc_ctypes:NativeVelocityVerletIntegrationEngine"
cythonized_rkck_engine = "py_ballisticcalc_ctypes:NativeCashKarpIntegrationEngine"
cythonized_dopri_engine = "py_ballisticcalc_ctypes:NativeDormandPrinceIntegrationEngine"
cythonized_tsitouras_engine = "py_ballisticcalc_ctypes:NativeTsitourasIntegrationEngine"

[project.entry-points."py_ballisticcalc.engines.cython"]
euler = "py_ballisticcalc_ctypes:NativeEulerIntegrationEngine"
rk4 = "py_ballisticcalc_ctypes:NativeRK4IntegrationEngine"
verlet = "py_ballisticcalc_ctypes:NativeVelocityVerletIntegrationEngine"
rkck = "py_ballisticcalc_ctypes:NativeCashKarpIntegrationEngine"
dopri = "py_ballisticcalc_ctypes:NativeDormandPrinceIntegrationEngine"
tsitouras = "py_ballisticcalc_ctypes:NativeTsitourasIntegrationEngine"

[project.urls]
"Homepage" = "https://github.com/o-murphy/py-ballisticcalc"
"Documentation" = "https://o-murphy.github.io/py-ballisticcalc"
"Bug Reports" = "https://github.com/o-murphy/py-ballisticcalc/issues"
"Source" = "https://github.com/o-murphy/py-ballisticcalc"

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
# the native library is built into this directory by setup.py
py_ballisticcalc_ctypes = ["py.typed", "_native_lib/*"]

[tool.setuptools.packages.find]
where = ["."]
include = ["py_ballisticcalc_ctypes*"]

[tool.setuptools_scm]
root = ".."  # required for valid .git repo root detect for subpackage in monorepo
fallback_version = "0.0.0.dev0"

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-m 'not stress'"
markers = ["stress: long-running or resource-intensive tests, opt-in only"]

[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "setup.py" },
    { file = "_bclibc.py" },
    { file = "py_ballisticcalc_ctypes/**/*.py" },
    { file = "py_ballisticcalc_ctypes/external/**/*.{cpp,hpp,h}" },
    # version (setuptools-scm) must match the core package, which is re-resolved on every commit
    { git = { commit = true } },
]

[dependency-groups]
# ctypesgen makes py_ballisticcalc_ctypes/_native_gen.py from bclibc_ffi.h (regenerate_bindings.py); the result is
# committed, so building the package needs neither ctypesgen nor a C preprocessor. Pinned: the output must be reproducible.
dev = [
    "ctypesgen==1.1.1",
]
# What cibuildwheel installs next to a wheel to test it (see [tool.cibuildwheel] test-groups): the same as in
# py_ballisticcalc.exts. The core is not installed there, cibw_run_engines.py puts the core wheel on the path, so the
# core's own dependencies are listed here (and numpy, scipy of its `scipy` extra).
test-noscipy = [
    "pytest",
    "pytest-xdist",
    "typing_extensions>=4.15.0",
    "Deprecated>=3.0.1; python_version >= '3.12'",
    "Deprecated>=1.3.1; python_version < '3.12'",
]
test = [
    {include-group = "test-noscipy"},
    "numpy>=2.5.0; python_version >= '3.12'",
    "numpy>=2.4.6; python_version < '3.12'",
    "scipy>=1.18.0; python_version >= '3.12'",
    "scipy>=1.17.1; python_version < '3.12'",
]

# One interpreter builds the wheel: it is py3-none, so the builds for the other Pythons would give the same file. PyPy and
# GraalPy builds (pp311-*, gp312_250-*) are chosen with the `build` input of the workflow and need `enable`.
[tool.cibuildwheel]
build-frontend = "build[uv]"
build = "cp311-*"
enable = ["pypy", "graalpy"]
# After each wheel is built, cibuildwheel installs it in a clean environment and runs every engine of the core test suite
# there (.github/scripts/cibw_run_engines.py); cibuildwheel-reusable.yml stages cibw_stage/ (the core tests, the core
# wheel) and the runner in this folder, nothing of it is committed. The core wheel is put on the path by the runner.
test-sources = ["cibw_stage", "cibw_run_engines.py"]
test-groups = ["test"]
test-command = "python cibw_run_engines.py cython"

# No scipy wheels for these (see py_ballisticcalc.exts): the group without numpy and scipy, the scipy engines are left out
[[tool.cibuildwheel.overrides]]
select = ["*_i686", "*_armv7l", "*_ppc64le", "*_s390x", "*_riscv64", "*-win32", "pp*", "gp*"]
test-groups = ["test-noscipy"]

[tool.cibuildwheel.linux]
# Docker's default seccomp profile on the Ubuntu runners refuses 32-bit socket calls: uv panics (SIGABRT) in the i686
# container. Run the Linux containers with seccomp unconfined (the same as py_ballisticcalc.exts).
container-engine = { name = "docker", create-args = ["--security-opt", "seccomp=unconfined"] }

# uv is not in the musllinux containers of these architectures (`which uv` fails): the plain build frontend there
[[tool.cibuildwheel.overrides]]
select = ["*_ppc64le", "*_s390x", "*_riscv64"]
build-frontend = "build"

[tool.cibuildwheel.android]
build = "cp313-android_*"
# Android accepts only a test command that starts with "python" and contains -m or -c: start the runner through runpy
test-command = "python -c \"import runpy,sys; sys.argv=['cibw_run_engines.py','cython']; runpy.run_path('cibw_run_engines.py', run_name='__main__')\""
# no scipy wheels for Android
test-groups = ["test-noscipy"]
# there is no arm64 emulator on the runners: that wheel is built, not tested
test-skip = "*-android_arm64_v8a"
